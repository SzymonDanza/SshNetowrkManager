{% extends "base.html" %}

{% block title %}Logowanie SSH - Network Manager{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>Network Manager</h1>
            <p class="text-secondary">Połącz z routerem przez SSH</p>
        </div>

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form action="/connect" method="POST">
            <div class="form-group">
                <label for="ip">Adres IP routera</label>
                <input type="text" id="ip" name="ip" placeholder="192.168.1.1" required autofocus>
            </div>

            <div class="form-group">
                <label for="username">Login</label>
                <input type="text" id="username" name="username" placeholder="admin" required>
            </div>

            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">
                Połącz
            </button>
        </form>
    </div>
</div>
{% endblock %}
