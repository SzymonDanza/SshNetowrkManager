{% extends "base.html" %}

{% block title %}Logi systemowe - Network Manager{% endblock %}

{% block content %}
<h1>🧾 Logi systemowe routera</h1>

<pre id="logsBox">{{ logs }}</pre>

<form method="GET" action="/logs">
    <button type="submit">🔄 Odśwież logi</button>
</form>

<style>
    h1 {
        text-align: center;
        margin-top: 40px;
        color: #333;
    }
    pre {
        background-color: #111;
        color: #0f0;
        padding: 15px;
        border-radius: 8px;
        height: 600px;
        overflow-y: auto;
        font-size: 14px;
        font-family: monospace;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        margin-top: 20px;
    }
    form {
        text-align: center;
        margin-top: 20px;
    }
    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background-color: #0056b3;
    }
</style>
{% endblock %}
