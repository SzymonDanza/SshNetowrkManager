{% extends "base.html" %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<div class="login-box">
    <h2>Logowanie</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Hasło</label>
        <input type="password" name="password" required>
        <button type="submit">Zaloguj</button>
    </form>
    <p><a href="{{ url_for('auth.register') }}">Nie masz konta? Zarejestruj się</a></p>
</div>
{% endblock %}
