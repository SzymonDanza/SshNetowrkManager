{% extends "base.html" %}
{% block title %}Rejestracja{% endblock %}
{% block content %}
<div class="login-box">
    <h2>Rejestracja</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Hasło</label>
        <input type="password" name="password" required>
        <button type="submit">Zarejestruj</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">Masz już konto? Zaloguj się</a></p>
</div>
{% endblock %}
