<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel zarządzania siecią</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        .submenu {
            display: none;
            margin-top: 15px;
        }
        .main-menu {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }
        .submenu button {
            background-color: #17a2b8;
        }
        .submenu button:hover {
            background-color: #117a8b;
        }
    </style>
</head>
<body>
    <h1>Network Manager</h1>
    <p>Zalogowano jako: <b>{{ username }}</b> ({{ ip }})</p>

    <!-- Główne menu -->
    <div class="main-menu">
        <div>
            <button onclick="toggleMenu()">Network</button>
            <div id="submenu" class="submenu">
                <button onclick="window.location.href='/lan'">LAN</button>
                <button onclick="window.location.href='/wireless'">Wireless</button>
                <button onclick="window.location.href='/dhcp'">DHCP</button>
            </div>
        </div>

        <div>
            <button onclick="window.location.href='/logs'">System</button>
            <button onclick="window.location.href='/status'">📶 Status urządzenia</button>
        </div>
    </div>

    <script>
    function toggleMenu() {
        const submenu = document.getElementById("submenu");
        submenu.style.display = (submenu.style.display === "block") ? "none" : "block";
    }
    </script>
</body>
</html>
