<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie SSH</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 20px; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔐 Połącz z routerem</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/connect" method="POST">
        <label>Adres IP routera:</label><br>
        <input type="text" name="ip" placeholder="192.168.1.1" required><br>

        <label>Login:</label><br>
        <input type="text" name="username" placeholder="admin" required><br>

        <label>Hasło:</label><br>
        <input type="password" name="password" required><br>

        <button type="submit">Połącz</button>
    </form>
</body>
</html>
