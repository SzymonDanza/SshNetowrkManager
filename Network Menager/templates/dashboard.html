<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel zarządzania siecią</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }
        .submenu {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>📡 Network Manager</h1>
    <p>Zalogowano jako: <b>{{ username }}</b> ({{ ip }})</p>

    <div>
        <button onclick="toggleMenu()">🌐 Network</button>
    </div>

    <div id="submenu" class="submenu">
        <button onclick="window.location.href='/lan'">LAN</button>
        <button onclick="window.location.href='/wireless'">Wireless</button>
        <button onclick="window.location.href='/dhcp'">DHCP</button>
    </div>

    <script>
function toggleMenu() {
    const submenu = document.getElementById("submenu");
    const current = submenu.style.display;
    if (current === "" || current === "none") {
        submenu.style.display = "block";
    } else {
        submenu.style.display = "none";
    }
}
</script>
</body>
</html>
